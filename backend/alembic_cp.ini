# Alembic Configuration -- cycle-purchase database (cycle-purchase.db)
#
# !! ASCII ONLY -- DO NOT PUT NON-ASCII CHARACTERS IN THIS FILE !!
#     Alembic reads .ini with encoding="locale". On Windows zh-TW that is cp950,
#     so any UTF-8 byte (Chinese text, em dash, emoji) raises UnicodeDecodeError
#     before Alembic even starts. Chinese notes live in alembic/env.py instead.
#
# The main database uses a separate config: alembic.ini
#     (script_location = alembic)
#
# 2026-08-28: this file previously had NO [alembic] section header, which made
#     every alembic command fail with MissingSectionHeaderError. That is why
#     Alembic was never used and schema changes were hand-written as
#     _migrate_* functions in main.py.

[alembic]
# path to migration scripts
script_location = alembic_cp

# date-prefixed version filenames so versions/ sorts chronologically
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# encoding used when writing generated version files
# (revision messages may contain Chinese; the .ini itself must stay ASCII)
output_encoding = utf-8

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's auto-generated by the rev_id
# (template filename) - defaults to 40
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# logging configuration
# Logging is enabled by default. set to 'false' to disable
# logging_config = file_name

# log file to write to
# logfile = alembic.log

[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
