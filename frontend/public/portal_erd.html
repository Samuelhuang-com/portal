<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:#f0f4f8;color:#1f2937;overflow:hidden;display:flex;flex-direction:column}
header{background:#1B3A5C;color:#fff;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0}
input,select,button{font:inherit;font-size:13px;padding:4px 8px;border-radius:4px;border:1px solid #cbd5e1}
button{background:#4BA8E8;color:#fff;border:none;cursor:pointer}
header label{font-size:12.5px;display:flex;gap:4px;align-items:center}
#stats{font-size:12px;opacity:.85;margin-left:auto}
#wrap{flex:1;position:relative;overflow:hidden;cursor:grab}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.grp{position:absolute;border:1px dashed #94a3b8;border-radius:8px;background:rgba(255,255,255,.4)}
.grp .gh{font-size:13px;font-weight:700;color:#1B3A5C;padding:4px 8px}
.card{position:absolute;width:250px;background:#fff;border:1px solid #cbd5e1;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:12px;cursor:move;user-select:none}
.card .hd{background:#1B3A5C;color:#fff;padding:5px 8px;border-radius:5px 5px 0 0;font-weight:700;font-size:12.5px;word-break:break-all}
.card .hd small{display:block;font-weight:400;opacity:.8;font-size:10.5px}
.card .r{display:flex;align-items:center;gap:4px;padding:2px 8px;border-top:1px solid #f1f5f9;white-space:nowrap}
.card .r.pk{background:#fef9c3}
.card .r.fk{background:#eef6ff}
.cn{flex:1;overflow:hidden;text-overflow:ellipsis}
.ft{color:#2563eb;font-size:10px;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.ty{color:#64748b;font-size:10.5px}
.bd{font-size:9.5px;padding:0 3px;border-radius:3px;color:#fff}
.bd.pk{background:#ca8a04}.bd.fk{background:#2563eb}.bd.nn{background:#94a3b8}
.more{padding:2px 8px;color:#94a3b8;font-size:11px;border-top:1px solid #f1f5f9}
.card.dim{opacity:.13}
.card.hit{outline:2px solid #22c55e}
.card.sel{outline:3px solid #f59e0b}
.edge{fill:none;stroke:#7c8da0;stroke-width:1.2;opacity:.55}
.edge.hl{stroke:#f59e0b;stroke-width:2.4;opacity:1}
.edge.dim{opacity:.05}
#panel{position:absolute;right:0;top:0;bottom:0;width:360px;background:#fff;border-left:1px solid #cbd5e1;overflow:auto;padding:12px;font-size:12.5px;display:none;box-shadow:-2px 0 8px rgba(0,0,0,.1)}
#panel.show{display:block}
#panel h2{margin:0 0 4px;font-size:15px;color:#1B3A5C;word-break:break-all}
#panel .sub{color:#64748b;font-size:11.5px;margin-bottom:8px}
#panel h3{font-size:12.5px;margin:12px 0 4px;color:#1B3A5C}
#panel table{width:100%;border-collapse:collapse}
#panel td{padding:2px 4px;border-bottom:1px solid #eee;font-size:12px;vertical-align:top}
#panel a{color:#2563eb;cursor:pointer;text-decoration:underline;word-break:break-all}
#panel .x{float:right;cursor:pointer;color:#64748b}
.help{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:#475569;background:rgba(255,255,255,.85);padding:4px 8px;border-radius:4px}

const T = DATA.map(t => ({name:t.table, cls:t.cls, group:t.file.replace(/\.py$/,''), cols:t.cols, x:0, y:0, el:null, visible:true}));
const byName = {};
T.forEach(t => byName[t.name] = t);
const E = [];
T.forEach(t => t.cols.forEach(c => {
  if (c.fk) {
    const tn = c.fk.split('.')[0];
    if (byName[tn]) E.push({a:t.name, b:tn, col:c.name, ref:c.fk});
  }
}));
const relSet = new Set();
E.forEach(e => { relSet.add(e.a); relSet.add(e.b); });

const wrap = document.getElementById('wrap');
const canvas = document.getElementById('canvas');
const svg = document.getElementById('edges');
const panel = document.getElementById('panel');
const S = {s:1, tx:20, ty:20};
let selName = null;
const CW = 250, GAP = 18, MAXW = 1900;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function cardHTML(t){
  const showAll = document.getElementById('showall').checked;
  let rows = t.cols.filter(c => showAll || c.pk || c.fk);
  if (!showAll && rows.length === 0) rows = t.cols.slice(0, 4);
  const hidden = t.cols.length - rows.length;
  const body = rows.map(c => {
    const cls = c.pk ? 'pk' : (c.fk ? 'fk' : '');
    const bd = (c.pk ? '<span class="bd pk">PK</span>' : '') + (c.fk ? '<span class="bd fk">FK</span>' : '') + (c.nn && !c.pk ? '<span class="bd nn">NN</span>' : '');
    const ft = c.fk ? '<span class="ft" title="'+esc(c.fk)+'">→ '+esc(c.fk)+'</span>' : '';
    return '<div class="r '+cls+'"><span class="cn" title="'+esc(c.name)+'">'+esc(c.name)+'</span>'+ft+'<span class="ty">'+esc(c.type)+'</span>'+bd+'</div>';
  }).join('');
  return '<div class="hd">'+esc(t.name)+'<small>'+esc(t.cls)+' ｜ '+esc(t.group)+'.py ｜ '+t.cols.length+' 欄</small></div>'+body+(hidden>0?'<div class="more">… 另 '+hidden+' 欄（勾選「顯示全部欄位」）</div>':'');
}

T.forEach(t => {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.t = t.name;
  canvas.appendChild(el);
  t.el = el;
  el.innerHTML = cardHTML(t);
});

const groupSel = document.getElementById('grp');
[...new Set(T.map(t => t.group))].sort().forEach(g => {
  const o = document.createElement('option');
  o.value = g;
  o.textContent = g + '（' + T.filter(t => t.group === g).length + '）';
  groupSel.appendChild(o);
});

function applyVisibility(){
  const g = groupSel.value;
  const onlyRel = document.getElementById('onlyrel').checked;
  T.forEach(t => {
    t.visible = (!g || t.group === g) && (!onlyRel || relSet.has(t.name));
    t.el.style.display = t.visible ? '' : 'none';
  });
}

function layout(){
  applyVisibility();
  canvas.querySelectorAll('.grp').forEach(n => n.remove());
  const groups = {};
  T.filter(t => t.visible).forEach(t => (groups[t.group] = groups[t.group] || []).push(t));
  const keys = Object.keys(groups).sort();
  let cx = 20, cy = 20, shelfH = 0, maxX = 0, maxY = 0;
  keys.forEach(k => {
    const list = groups[k].sort((a,b) => a.name.localeCompare(b.name));
    const cols = Math.min(3, list.length);
    const blockW = cols * (CW + GAP) + GAP;
    const rowsCount = Math.ceil(list.length / cols);
    const rowH = [];
    list.forEach((t,i) => { const r = Math.floor(i/cols); rowH[r] = Math.max(rowH[r] || 0, t.el.offsetHeight); });
    const blockH = 30 + rowH.reduce((a,b) => a + b + GAP, 0) + GAP;
    if (cx > 20 && cx + blockW > MAXW) { cx = 20; cy += shelfH + 30; shelfH = 0; }
    const g = document.createElement('div');
    g.className = 'grp';
    g.style.left = cx+'px'; g.style.top = cy+'px'; g.style.width = blockW+'px'; g.style.height = blockH+'px';
    g.innerHTML = '<div class="gh">'+esc(k)+'.py（'+list.length+' 表）</div>';
    canvas.insertBefore(g, svg);
    let yy = cy + 30 + GAP;
    for (let r = 0; r < rowsCount; r++) {
      for (let c = 0; c < cols; c++) {
        const t = list[r*cols + c];
        if (!t) continue;
        t.x = cx + GAP + c*(CW+GAP);
        t.y = yy;
        place(t);
      }
      yy += rowH[r] + GAP;
    }
    cx += blockW + 30;
    shelfH = Math.max(shelfH, blockH);
    maxX = Math.max(maxX, cx); maxY = Math.max(maxY, cy + blockH);
  });
  svg.setAttribute('width', maxX + 400);
  svg.setAttribute('height', maxY + 400);
  T.forEach(t => { if (t.visible) t.h = t.el.offsetHeight; });
  drawEdges();
  updateStats();
}

function place(t){ t.el.style.left = t.x+'px'; t.el.style.top = t.y+'px'; }

function rectEdge(cx, cy, w, h, tx, ty){
  const dx = tx-cx, dy = ty-cy;
  if (dx === 0 && dy === 0) return [cx, cy];
  const sx = dx !== 0 ? (w/2)/Math.abs(dx) : Infinity;
  const sy = dy !== 0 ? (h/2)/Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy);
  return [cx + dx*s, cy + dy*s];
}

function drawEdges(){
  const NS = 'http://www.w3.org/2000/svg';
  svg.querySelectorAll('path.edge').forEach(p => p.remove());
  E.forEach(e => {
    const A = byName[e.a], B = byName[e.b];
    if (!A.visible || !B.visible) return;
    const ax = A.x + CW/2, ay = A.y + A.el.offsetHeight/2;
    const bx = B.x + CW/2, by = B.y + B.el.offsetHeight/2;
    const p1 = rectEdge(ax, ay, CW, A.el.offsetHeight, bx, by);
    const p2 = rectEdge(bx, by, CW, B.el.offsetHeight, ax, ay);
    const path = document.createElementNS(NS, 'path');
    let cls = 'edge';
    if (selName) cls += (e.a === selName || e.b === selName) ? ' hl' : ' dim';
    path.setAttribute('class', cls);
    path.setAttribute('d', 'M'+p1[0]+','+p1[1]+' L'+p2[0]+','+p2[1]);
    path.setAttribute('marker-end', 'url(#arr)');
    const title = document.createElementNS(NS, 'title');
    title.textContent = e.a + '.' + e.col + ' → ' + e.ref;
    path.appendChild(title);
    svg.appendChild(path);
    e.el = path;
  });
}

function updateStats(){
  const vt = T.filter(t => t.visible).length;
  const ve = E.filter(e => byName[e.a].visible && byName[e.b].visible).length;
  document.getElementById('stats').textContent = '顯示 '+vt+' / '+T.length+' 表 ｜ 關聯 '+ve+' / '+E.length+'（FK 宣告）';
}

function apply(){ canvas.style.transform = 'translate('+S.tx+'px,'+S.ty+'px) scale('+S.s+')'; }

function fit(){
  const vis = T.filter(t => t.visible);
  if (!vis.length) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  vis.forEach(t => { minX=Math.min(minX,t.x); minY=Math.min(minY,t.y); maxX=Math.max(maxX,t.x+CW); maxY=Math.max(maxY,t.y+t.el.offsetHeight); });
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const s = Math.min(W/(maxX-minX+60), H/(maxY-minY+60), 1.2);
  S.s = s;
  S.tx = (W - (maxX-minX)*s)/2 - minX*s;
  S.ty = (H - (maxY-minY)*s)/2 - minY*s;
  apply();
}

function centerOn(t){
  S.s = Math.max(S.s, 0.9);
  S.tx = wrap.clientWidth/2 - (t.x + CW/2)*S.s;
  S.ty = wrap.clientHeight/2 - (t.y + t.el.offsetHeight/2)*S.s;
  apply();
}

function select(name){
  selName = name;
  T.forEach(t => t.el.classList.toggle('sel', t.name === name));
  drawEdges();
  if (!name) { panel.classList.remove('show'); return; }
  const t = byName[name];
  const outs = E.filter(e => e.a === name);
  const ins = E.filter(e => e.b === name);
  let h = '<span class="x" id="closep">✕</span><h2>'+esc(t.name)+'</h2>';
  h += '<div class="sub">'+esc(t.cls)+' ｜ '+esc(t.group)+'.py ｜ '+t.cols.length+' 欄</div>';
  h += '<h3>欄位</h3><table>';
  t.cols.forEach(c => {
    const flags = (c.pk?'<span class="bd pk">PK</span> ':'')+(c.fk?'<span class="bd fk">FK</span> ':'')+(c.nn&&!c.pk?'<span class="bd nn">NN</span>':'');
    h += '<tr><td>'+esc(c.name)+'</td><td class="ty">'+esc(c.type)+'</td><td>'+flags+(c.fk?'<br><span class="ty">→ '+esc(c.fk)+'</span>':'')+'</td></tr>';
  });
  h += '</table>';
  h += '<h3>參照的表（我指向）'+' ('+outs.length+')</h3>';
  h += outs.length ? outs.map(e => '<div>'+esc(e.col)+' → <a data-go="'+esc(e.b)+'">'+esc(e.b)+'</a></div>').join('') : '<div class="ty">無</div>';
  h += '<h3>被參照的表（指向我）'+' ('+ins.length+')</h3>';
  h += ins.length ? ins.map(e => '<div><a data-go="'+esc(e.a)+'">'+esc(e.a)+'</a> ．'+esc(e.col)+'</div>').join('') : '<div class="ty">無</div>';
  panel.innerHTML = h;
  panel.classList.add('show');
  document.getElementById('closep').onclick = () => select(null);
  panel.querySelectorAll('a[data-go]').forEach(a => a.onclick = () => { const tt = byName[a.dataset.go]; if (!tt.visible) { groupSel.value=''; document.getElementById('onlyrel').checked=false; layout(); } select(tt.name); centerOn(tt); });
}

let drag = null;
wrap.addEventListener('mousedown', e => {
  const card = e.target.closest('.card');
  if (card) drag = {type:'card', t: byName[card.dataset.t], sx:e.clientX, sy:e.clientY, ox:0, oy:0, moved:false};
  else drag = {type:'pan', sx:e.clientX, sy:e.clientY, ox:S.tx, oy:S.ty, moved:false};
  if (drag.type === 'card') { drag.ox = drag.t.x; drag.oy = drag.t.y; }
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  if (drag.type === 'card') {
    drag.t.x = drag.ox + dx/S.s; drag.t.y = drag.oy + dy/S.s;
    place(drag.t); drawEdges();
  } else if (drag.moved) {
    S.tx = drag.ox + dx; S.ty = drag.oy + dy; apply();
  }
});
window.addEventListener('mouseup', () => {
  if (drag && !drag.moved) {
    if (drag.type === 'card') select(drag.t.name);
    else select(null);
  }
  drag = null;
});
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const f = e.deltaY < 0 ? 1.12 : 1/1.12;
  const ns = Math.min(3, Math.max(0.1, S.s*f));
  S.tx = mx - (mx - S.tx) * (ns/S.s);
  S.ty = my - (my - S.ty) * (ns/S.s);
  S.s = ns; apply();
}, {passive:false});

const q = document.getElementById('q');
function search(){
  const term = q.value.trim().toLowerCase();
  T.forEach(t => {
    const hit = term && (t.name.toLowerCase().includes(term) || t.cols.some(c => c.name.toLowerCase().includes(term)));
    t.el.classList.toggle('hit', !!hit);
    t.el.classList.toggle('dim', !!term && !hit);
  });
  return T.filter(t => t.visible && t.el.classList.contains('hit'));
}
q.addEventListener('input', search);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const hits = search();
    if (hits.length) { select(hits[0].name); centerOn(hits[0]); }
  }
});

groupSel.addEventListener('change', () => { layout(); fit(); });
document.getElementById('onlyrel').addEventListener('change', () => { layout(); fit(); });
document.getElementById('showall').addEventListener('change', () => {
  T.forEach(t => t.el.innerHTML = cardHTML(t));
  layout();
});
document.getElementById('fit').addEventListener('click', fit);
document.getElementById('relayout').addEventListener('click', () => { layout(); fit(); });
window.addEventListener('resize', fit);

layout();
S.s = 0.6; S.tx = 20; S.ty = 20; apply();
</script>
</body></html>
